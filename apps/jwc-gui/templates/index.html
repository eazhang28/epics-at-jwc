<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}" />
  <title>Jackson Writing Center</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pagestyle.css') }}">
</head>
<body>

  <nav>
    <div class="brand">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Jackson Writing Center Logo" height="20" style="vertical-align: middle"/>
      <strong>Jackson Writing Center</strong>
    </div>
    <div>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('write') }}">Write</a>
      <a href="{{ url_for('about') }}">About Us</a>
      <a id="authLink" href="{{ url_for('login') }}">Login</a>

  <section id="home" class="page active center">
    <h1>Jackson Writing Center</h1>
    <img src="{{ url_for('static', filename='images/homepage_img.jpg') }}" class="home-image">
    <div class="button" onclick="window.location='{{ url_for('write') }}'">Start Writing</div>
  </section>

  <footer>
    © 2026 Jackson Writing Center

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</html>
